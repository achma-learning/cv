<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae</title>
    <meta name="description" content="Curriculum vitae.">
    <meta name="theme-color" content="#ffffff">

    <!-- Link previews (title/description are filled in from your CV data) -->
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Curriculum Vitae">
    <meta property="og:description" content="Curriculum vitae.">
    <meta property="og:image" content="img.jpg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Curriculum Vitae">

    <!-- Favicon & PWA manifest -->
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- Icons & fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap">
    <link rel="stylesheet" href="assets/cv.css">

    <!-- Optional enhancements: PDF export and QR code. Both are pinned, and
         the page degrades gracefully if either fails to load. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <!-- CV content and rendering. Order matters; `defer` preserves it. -->
    <script defer src="assets/cv-data.js"></script>
    <script defer src="assets/cv-store.js"></script>
    <script defer src="assets/cv-render.js"></script>
    <script defer src="assets/cv-page.js"></script>
</head>
<body>

    <nav class="toolbar no-print" aria-label="CV actions">
        <a href="admin/" class="btn btn-quiet" id="adminBtn" hidden>Edit CV</a>
        <button type="button" class="btn" id="toggle-view" aria-pressed="false">View as Card</button>
        <button type="button" class="btn" id="downloadBtn">Download PDF</button>
    </nav>

    <noscript>
        <p class="notice">This CV is rendered with JavaScript. Please enable it, or read
        the printable version linked from the repository.</p>
    </noscript>

    <div class="container">

        <!-- ============================ FULL CV ============================ -->
        <article id="cv-view">
            <img id="cv-photo" class="profile-pic" alt="" hidden>
            <header class="header">
                <h1 id="cv-name"></h1>
                <p class="tagline" id="cv-tagline"></p>
            </header>
            <address class="contact-info" id="cv-contacts"></address>
            <main id="cv-main"></main>
            <footer class="footer">
                <div class="qr-code" id="qrcode-cv"></div>
                <img id="cv-signature" class="signature" alt="" hidden>
            </footer>
        </article>

        <!-- =========================== CARD VIEW =========================== -->
        <article id="card-view" hidden>
            <img id="card-photo" class="profile-pic" alt="" hidden>
            <header class="header">
                <h1 id="card-name"></h1>
                <p class="tagline" id="card-tagline"></p>
            </header>
            <nav class="linktree-links" id="card-links" aria-label="Contact links"></nav>
            <footer class="footer">
                <div class="qr-code" id="qrcode-card"></div>
                <img id="card-signature" class="signature" alt="" hidden>
            </footer>
        </article>

    </div>

</body>
</html>
